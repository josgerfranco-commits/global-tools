<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTools Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>🛠️ GlobalTools Hub</h1>
    </header>

    <!-- Barra de navegación / Pestañas -->
    <nav class="nav-bar">
        <button class="nav-btn active" onclick="switchTool('interes')">💰 Interés Compuesto</button>
        <button class="nav-btn" onclick="switchTool('divisas')">🔀 Conversor Divisas</button>
        <button class="nav-btn" onclick="switchTool('passwords')">🔑 Generador Contraseñas</button>
        <button class="nav-btn" onclick="switchTool('contador')">📝 Contador Palabras</button>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        
        <!-- Herramienta 1: Interés Compuesto -->
        <section id="interes" class="tool-card active">
            <h2>Calculadora de Interés Compuesto</h2>
            <div class="form-group">
                <label>Capital Inicial ($):</label>
                <input type="number" id="capital" value="1000">
            </div>
            <div class="form-group">
                <label>Tasa de Interés Anual (%):</label>
                <input type="number" id="tasa" value="5">
            </div>
            <div class="form-group">
                <label>Tiempo (Años):</label>
                <input type="number" id="tiempo" value="10">
            </div>
            <button class="action-btn" onclick="calcularInteres()">Calcular</button>
            <div id="resultado-interes" class="result-box"></div>
        </section>

        <!-- Herramienta 2: Conversor de Divisas -->
        <section id="divisas" class="tool-card">
            <h2>Conversor de Divisas</h2>
            <div class="form-group">
                <label>Monto:</label>
                <input type="number" id="monto" value="100">
            </div>
            <div class="form-group">
                <label>De:</label>
                <select id="moneda-de">
                    <option value="USD">USD - Dólar EE.UU.</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GTQ" selected>GTQ - Quetzal</option>
                </select>
            </div>
            <div class="form-group">
                <label>A:</label>
                <select id="moneda-a">
                    <option value="USD" selected>USD - Dólar EE.UU.</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GTQ">GTQ - Quetzal</option>
                </select>
            </div>
            <button class="action-btn" onclick="convertirDivisa()">Convertir</button>
            <div id="resultado-divisa" class="result-box"></div>
        </section>

        <!-- Herramienta 3: Generador de Contraseñas -->
        <section id="passwords" class="tool-card">
            <h2>Generador de Contraseñas Seguras</h2>
            <div class="form-group">
                <label>Longitud de la contraseña: <span id="length-val">16</span></label>
                <input type="range" id="pass-length" min="6" max="32" value="16" oninput="document.getElementById('length-val').innerText = this.value">
            </div>
            <div class="form-group checkbox-group">
                <label><input type="checkbox" id="inc-numeros" checked> Incluir Números</label>
                <label><input type="checkbox" id="inc-simbolos" checked> Incluir Símbolos</label>
            </div>
            <button class="action-btn" onclick="generarPassword()">Generar Contraseña</button>
            <div id="resultado-password" class="result-box"></div>
        </section>

        <!-- Herramienta 4: Contador de Palabras -->
        <section id="contador" class="tool-card">
            <h2>Contador de Palabras y Caracteres</h2>
            <div class="form-group">
                <textarea id="texto-analizar" rows="5" placeholder="Escribe o pega tu texto aquí..." oninput="contarTexto()"></textarea>
            </div>
            <div class="stats-box">
                <p>Palabras: <span id="count-words">0</span></p>
                <p>Caracteres: <span id="count-chars">0</span></p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
